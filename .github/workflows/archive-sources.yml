name: Archive source pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Request Internet Archive snapshots
        run: python bag-arbitrage/pipeline/archive_sources.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bag-arbitrage/pipeline/archived_sources.csv
          git diff --cached --quiet || git commit -m "Record Internet Archive snapshots of source pages"
          git push
