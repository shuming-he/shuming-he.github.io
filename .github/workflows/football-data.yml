name: Football data

on:
  push:
    branches: [football]
    paths: [football-value/pipeline/fetch_data.py, .github/workflows/football-data.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and filter the public dataset
        run: |
          pip install pandas==2.2.3
          python football-value/pipeline/fetch_data.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add football-value/data/raw
          git diff --cached --quiet || git commit -m "Football data: refresh raw files"
          git push
